name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Windows App
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1.3.1
      
      - name: Install Visual Studio prerequisites
        run: |
          choco install visualstudio2019buildtools
          choco install visualstudio2019-workload-vctools

      - name: Install WebView2 SDK
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          Start-Process -FilePath "MicrosoftEdgeWebview2Setup.exe" -Args "/silent /install" -Wait
          if (-not $?) { throw "Failed to install WebView2" }

      - name: Download Flutter SDK
        run: |
          $flutterUrl = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.19.0-stable.zip"
          Invoke-WebRequest -Uri $flutterUrl -OutFile "flutter.zip"
          Expand-Archive -Path "flutter.zip" -DestinationPath "C:\"
          $env:PATH += ";C:\flutter\bin"
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          flutter --version
          flutter doctor -v

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: |
          flutter pub get
          if (-not $?) { throw "Flutter pub get failed" }

      - name: Build Windows release
        run: |
          flutter build windows --release
          if (-not $?) { throw "Build failed" }

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: build/windows/runner/Release/
          retention-days: 7
